       (Rundgang, Design, Hilfe, Über, App installieren) – gleich in allen Apps -->
  <span class="stand" id="stand" role="status" aria-live="polite"></span>
</header>

<main id="ansicht"><p class="lade">Imagicruise wird geladen …</p></main>
<noscript><p class="lade">Imagicruise braucht JavaScript.</p></noscript>

<!-- Ereignis bearbeiten -->
<dialog class="blatt" id="blatt" aria-labelledby="blatt-titel"></dialog>

<dialog class="blatt bildfenster" id="bild" aria-labelledby="bild-titel"></dialog>

<dialog class="blatt bildfenster" id="video" aria-labelledby="video-titel"></dialog>
<!-- Als Status teilen (status.js, Baustein vorlagen) -->
<dialog class="blatt bildfenster" id="status" aria-labelledby="status-titel"></dialog>
<!-- Fenster „Neue Reise“ (Rückfragen selbst kommen aus dem Baustein design) -->
<dialog class="frage" id="frage"></dialog>
<!-- Vorschau des Reiseberichts -->
<dialog class="vorschau" id="vorschau" aria-label="Vorschau des Reiseberichts">
  <div class="vorschau-kopf">
    <b>Vorschau</b>
    <div class="umschalter" role="group" aria-label="Breite der Vorschau">
      <button type="button" data-a="vorschau-breite" data-breite="handy">Handy</button>
      <button type="button" data-a="vorschau-breite" data-breite="voll" class="an">Bildschirm</button>
    </div>
    <button type="button" class="ds-knopf ds-klein" data-a="vorschau-zu">Schließen</button>
  </div>
  <div class="vorschau-rahmen"><iframe id="vorschau-seite" title="Reisebericht" src="about:blank"></iframe></div>
</dialog>
<!-- Rundgang: erklärt beim ersten Besuch Schritt für Schritt die Ansicht (wie in Imagiclique) -->
<dialog class="rundgang" id="rundgang" aria-labelledby="rg-titel"><div class="rg-licht"></div><div class="rg-blase"></div></dialog>
<!-- Meldungen unten, Rückfragen und die Ladeanzeige legt der Baustein design (design.js) selbst an -->
<!-- Hilfetext für die Seite „Hilfe“ im Menü ⋮ (Baustein menue). data-schritt: welcher Abschnitt beim Öffnen aufgeklappt ist
     (1 Liste der Reisen, 2 Tage, 3 Reise, 4 Karte, 5 Fertigstellen; siehe hilfeSchritt() in studio.js). -->
<template id="hilfetext">
  <details data-schritt="1"><summary>Meine Reisen</summary><div class="im-in">
    <p>Hier stehen alle deine Reisen. <b>„Neue Reise“</b> braucht nur einen Titel und den Zeitraum; für jeden Tag entsteht eine eigene Seite.</p>
    <p>Zum Ausprobieren gibt es die <b>Beispielreise</b> durchs Mittelmeer. <b>„Reisepaket einlesen“</b> holt eine Reise von deinem anderen Gerät oder aus einer Sicherung.</p>
    <p>Der <b>Rundgang</b> („Rundgang starten“ im Menü ⋮ oben rechts) zeigt dir jede Ansicht Schritt für Schritt.</p>
  </div></details>
  <details data-schritt="2"><summary>Tage und Ereignisse</summary><div class="im-in">
    <p>Oben wählst du den <b>Tag</b>. Zu jedem Tag gehören ein Ort, ein paar Sätze und die <b>Ereignisse</b>: Sehenswürdigkeiten, Ausflüge, Essen und mehr.</p>
    <p>Am schnellsten geht es mit <b>„Fotos zum Tag“</b>: Imagicruise bündelt die Fotos nach der Aufnahmezeit zu Ereignissen und übernimmt den Aufnahmeort für die Karte, wenn das Foto einen hat. Ein Ereignis öffnest du durch Antippen; gespeichert wird von selbst.</p>
    <p>Liegt ein Tag außerhalb des Zeitraums oder ist er falsch entstanden, entfernst du ihn mit <b>„Tag löschen“</b> bzw. <b>„Tag leeren“</b>.</p>
  </div></details>
  <details data-schritt="3"><summary>Fotos und Videos</summary><div class="im-in">
    <p>Unter <b>„Reise“</b> wählst du alle Fotos der Reise auf einmal. Imagicruise verteilt sie nach dem Aufnahmedatum auf die Tage. Dort wählst du auch das <b>Titelbild</b>.</p>
    <p>Unter jedem Foto: Bildtext, Reihenfolge, der Stift für die <b>Bildbearbeitung</b> (drehen, zuschneiden, verbessern) und der Stern für das Titelbild.</p>
    <p>Zu einem Ereignis passt ein <b>kurzes Video</b> von höchstens einer Minute. Du wählst den Ausschnitt, Imagicruise verkleinert es.</p>
    <p>Aufnahmeort und Kameradaten werden nur gelesen, um Tag, Uhrzeit und Position vorzuschlagen. In den gespeicherten Fotos stehen sie nicht.</p>
  </div></details>
  <details data-schritt="4"><summary>Die Karte</summary><div class="im-in">
    <p>Die Karte zeigt jeden Tag und jedes Ereignis mit Position, verbunden in der Reihenfolge der Reise. Sie ist gezeichnet; es wird nichts aus dem Internet geladen.</p>
    <p>Eine Position setzt du beim Tag oder beim Ereignis: über <b>„Position suchen“</b> (OpenStreetMap, nach Rückfrage), <b>„Mein Standort“</b> oder als Koordinaten.</p>
    <p>Unter <b>„Strecken und Verkehrsmittel“</b> wählst du für jede Strecke, wie du dorthin gekommen bist: Schiff, Fähre, Flugzeug, Bahn, Bus, Auto, Wohnmobil, Motorrad, Fahrrad, zu Fuß oder Seilbahn. Ohne Wahl schätzt Imagicruise aus der Art der Reise und der Entfernung („Automatisch“). Jedes Verkehrsmittel hat auf der Karte seine eigene Linie und ein kleines Bild.</p>
    <p><b>„▶ Route abspielen“</b> lässt die Route Strecke für Strecke wachsen, das Verkehrsmittel fährt mit. Denselben Knopf gibt es im Reisebericht unter der großen Karte.</p>
    <p><b>Zoomen und Verschieben:</b> mit <b>+</b> und <b>−</b> an der Karte oder mit dem Mausrad, auf dem Handy mit zwei Fingern. Ziehen mit der Maus oder einem Finger verschiebt den Ausschnitt, <b>⤢</b> zeigt wieder die ganze Route. Ganz nah heran steht „Küsten und Orte hier nur ungefähr“ in der Karte: Die Kartendaten zeigen keine Straßen, und die Küste liegt dort oft einige hundert Meter daneben. Im Reisebericht muss man die Karte erst anklicken bzw. antippen, damit man die Seite weiter blättern kann.</p>
    <p><b>„✋ Punkte verschieben“:</b> Liegt eine Marke nicht dort, wo sie hingehört, schalte das ein und ziehe sie mit Maus oder Finger an die richtige Stelle – am besten nach dem Heranzoomen. Die neue Position gilt für den Tag bzw. das Ereignis der Marke. <b>„↶ Rückgängig“</b> holt die alte Position zurück.</p>
  </div></details>
  <details data-schritt="5"><summary>Fertigstellen und Reisebericht</summary><div class="im-in">
    <p>Die <b>Prüfliste</b> zeigt, was noch fehlt. Die <b>Vorschau</b> zeigt den Reisebericht als Handy oder als großen Bildschirm.</p>
    <p><b>„Reisebericht speichern“</b> liefert eine kleine Webseite in einer ZIP-Datei zum Weitergeben oder Hochladen. Wer die Adresse kennt, kann den Bericht lesen; Suchmaschinen werden gebeten, ihn nicht aufzunehmen.</p>
  </div></details>
  <details data-schritt="6"><summary>Sicherung und zweites Gerät</summary><div class="im-in">
    <p>Das <b>Reisepaket</b> (unter „Fertigstellen“) ist deine Sicherung und der Weg, eine Reise auf ein anderes Gerät zu bringen, z. B. vom Handy auf den PC. Speichere es zwischendurch immer wieder.</p>
    <p>Liest du ein Reisepaket ein, das du schon hast, gleicht Imagicruise beide Fassungen ab: Neueres bleibt erhalten.</p>
    <p><b>Android-App neu installieren:</b> Die Freigabe-Fassung der App lässt sich nicht über eine Test-Fassung installieren (Android meldet dann „App nicht installiert“). Speichere vorher jede Reise als Reisepaket, deinstalliere die alte App, installiere die neue und lies die Reisepakete wieder ein. Beim Deinstallieren gehen die Reisen in der App verloren.</p>
  </div></details>
  <details data-schritt="7"><summary>KI-Hilfe, Infos zum Ort, Diktieren</summary><div class="im-in">
    <p><b>KI-Hilfe:</b> Imagicruise baut eine Frage für deine eigene KI-App (z. B. ChatGPT). Du kopierst oder teilst sie, fügst die Antwort ein und übernimmst, was passt. Imagicruise selbst schickt nichts an eine KI.</p>
    <p><b>Infos zum Ort:</b> schlägt in der Wikipedia nach, was in der Nähe liegt. Übertragen wird nur der Name oder die Position, nur auf Knopfdruck.</p>
    <p><b>Diktieren:</b> schreibt mit, was du sprichst. Dafür nutzt der Browser seine Spracherkennung (bei Chrome verarbeitet Google das Gesprochene, bei Edge Microsoft).</p>
  </div></details>
</template>
